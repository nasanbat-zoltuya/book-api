name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/book-api
  GITOPS_REPO: ${{ github.repository_owner }}/book-api-gitops

jobs:
  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & test with Maven
        run: mvn -B clean package

      - name: Generate image tag (short SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest

  update-manifest:
    name: Update GitOps repo
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update image tag in overlays/dev
        working-directory: gitops
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          sed -i "s|newName: .*|newName: ${IMAGE}|" overlays/dev/kustomization.yaml
          sed -i "s|newTag: .*|newTag: \"${TAG}\"|" overlays/dev/kustomization.yaml
          cat overlays/dev/kustomization.yaml

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: book-api image -> ${{ needs.build-and-push.outputs.tag }}"
          git push
